name: Debian 13 Stage II sudo inventory and isolated qualification (OWNER only)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RUN_STAGE2_SUDO_ISOLATED (no real service or private-state changes)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: twilight-debian13-stage2-qualification
  cancel-in-progress: false

jobs:
  stage2-sudo-and-synthetic:
    name: Debian 13 Stage II inventory, isolated C++/WebAdmin and synthetic recovery
    if: github.repository == 'adrianf87/dc24h.eu-twilight' && github.actor == 'adrianf87' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, twilight-debian13-stage2]
    timeout-minutes: 90
    env:
      EXPECTED_SHA: ${{ github.sha }}
      OWNER_CONFIRMATION: ${{ inputs.confirmation }}
      CI: 'true'
    steps:
      - name: Verify OWNER dispatch and passwordless sudo identity
        shell: bash
        run: |
          set -euo pipefail
          test "$OWNER_CONFIRMATION" = 'RUN_STAGE2_SUDO_ISOLATED'
          test "$RUNNER_NAME" = 'server-747585786'
          test "$(id -un)" = 'github-runner'
          test "$(sudo -n id -u)" = '0'

      - name: Checkout exact protected main SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Enforce exact source and inactive production services
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 self-hosted-runner-debian13/tests/runner_preflight.py \
            --expected-sha "$EXPECTED_SHA" > "$RUNNER_TEMP/stage2-runner-guard.json"
          python3 - "$RUNNER_TEMP/stage2-runner-guard.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          if data['result'] != 'INVENTORY_CLEAR':
              raise SystemExit('BLOCKED: actual services/processes/runner identity must be idle and known')
          PY

      - name: Privileged read-only VPS inventory; keep raw report private
        shell: bash
        run: |
          set -euo pipefail
          raw="$RUNNER_TEMP/stage2-root-inventory-private.json"
          sudo -n python3 scripts/public_stage2_preflight.py \
            --source-dir . --expected-sha "$EXPECTED_SHA" > "$raw"
          python3 - "$raw" "$RUNNER_TEMP/stage2-root-inventory-summary.json" <<'PY'
          import json, os, sys
          report = json.load(open(sys.argv[1], encoding='utf-8'))
          os.unlink(sys.argv[1])  # Raw privileged details never reach the build step.
          summary = {
              'source_sha': report['source']['actual_sha'],
              'debian_13': report['host']['os_id'] == 'debian' and report['host']['os_major'] == '13',
              'sudo_root_inventory': report['host']['elevated_inventory'],
              'preflight': report['preflight'],
              'production_go': False,
              'migration_go': False,
              'public_listener_go': False,
          }
          with open(sys.argv[2], 'w', encoding='utf-8') as handle:
              json.dump(summary, handle, indent=2, sort_keys=True)
          if summary['preflight'] != 'INVENTORY_CLEAR':
              raise SystemExit('BLOCKED: privileged preflight not clear')
          PY

      - name: Run synthetic restore, failure injection and static systemd contract
        shell: bash
        run: |
          set -euo pipefail
          python3 self-hosted-runner-debian13/tests/test_stage2_isolated_proof.py
          python3 self-hosted-runner-debian13/tests/stage2_isolated_proof.py \
            --scratch-parent "$RUNNER_TEMP" > "$RUNNER_TEMP/stage2-synthetic-evidence.json"

      - name: Isolated exact-SHA Debian 13 C++ and WebAdmin build; no host install
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d -p "$RUNNER_TEMP" twilight-stage2-build.XXXXXXXX)"
          (cd webadmin && npm ci --ignore-scripts --no-audit --no-fund && npm run build)
          cmake -S . -B "$stage/build" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$stage/prefix" -DC24H_INSTALL_WEBADMIN=ON \
            -DDC24H_REQUIRE_INTEGRATION_TESTS=ON
          cmake --build "$stage/build" --parallel 4
          # Curated unprivileged subset only. Full CTest includes host-mutating
          # sudo/systemd/dpkg process tests and must run on a disposable VM.
          ctest --test-dir "$stage/build" --output-on-failure \
            -R '^(project\.metadata|project\.metadata\.language_policy|public\.stage2\..*|beta\.baseline|core\.lifecycle|adc\.parser|chat\.core|search\.core)$'
          "$stage/build/dc24h-twilight" --version
          "$stage/build/dc24h-twilight" --config config/dc24h.ini.example --check-config
          cmake --install "$stage/build"
          test -f "$stage/prefix/share/dc24h/webadmin/index.html"
          test "$(sha256sum "$stage/build/dc24h-twilight" | cut -d' ' -f1)" = \
               "$(sha256sum "$stage/prefix/bin/dc24h-twilight" | cut -d' ' -f1)"
          printf '{"source_sha":"%s","scope":"TEMPORARY_PREFIX_ONLY","cpp_install":true,"webadmin_assets":true,"production_go":false}\n' \
            "$EXPECTED_SHA" > "$RUNNER_TEMP/stage2-build-summary.json"

      - name: Upload only bounded, sanitized test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: twilight-debian13-stage2-isolated-evidence
          path: |
            ${{ runner.temp }}/stage2-root-inventory-summary.json
            ${{ runner.temp }}/stage2-synthetic-evidence.json
            ${{ runner.temp }}/stage2-build-summary.json
          if-no-files-found: ignore
          retention-days: 7
