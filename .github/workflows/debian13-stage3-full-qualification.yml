name: Stage III OWNER extended public ADCS stability

# This workflow already has a dispatch entry on the default branch. Select the
# candidate branch so the extended checks run at its exact source SHA.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'RUN_STAGE3_PUBLIC_EXTENDED_STABILITY or RUN_STAGE3_UBUNTU_EXTERNAL_ONLY'
        required: true
        type: string
      production_restarts_ack:
        description: 'Must remain false. This workflow performs external client checks only.'
        required: true
        type: boolean
        default: false
      premerge_phase:
        description: 'Use none for extended stability. Before/after label an external snapshot.'
        required: true
        type: choice
        options: [none, before, after]
        default: none
      premerge_candidate_sha:
        description: 'Exact 40-character SHA of selected branch'
        required: true
        type: string

permissions:
  contents: read

env:
  PYTHONPATH: scripts
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  owner-gate:
    name: Verify OWNER dispatch and candidate SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check repository, actor, runner, ref, approval and mode
        env:
          OWNER_CONFIRMATION: ${{ inputs.confirmation }}
          PRODUCTION_RESTARTS_ACK: ${{ inputs.production_restarts_ack }}
          PREMERGE_PHASE: ${{ inputs.premerge_phase }}
          PREMERGE_CANDIDATE_SHA: ${{ inputs.premerge_candidate_sha }}
        run: |
          test "$RUNNER_ENVIRONMENT" = 'github-hosted'
          test "$GITHUB_REPOSITORY" = adrianf87/dc24h.eu-twilight
          test "$GITHUB_ACTOR" = adrianf87
          test "$GITHUB_TRIGGERING_ACTOR" = adrianf87
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          [[ "$GITHUB_REF" == refs/heads/?* ]]
          [[ "$PREMERGE_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$PREMERGE_CANDIDATE_SHA"
          test "$PRODUCTION_RESTARTS_ACK" = false
          case "$OWNER_CONFIRMATION" in
            RUN_STAGE3_PUBLIC_EXTENDED_STABILITY) test "$PREMERGE_PHASE" = none ;;
            RUN_STAGE3_UBUNTU_EXTERNAL_ONLY) [[ "$PREMERGE_PHASE" =~ ^(none|before|after)$ ]] ;;
            *) exit 1 ;;
          esac

  extended:
    name: Extended stability with exact-commit evidence
    needs: owner-gate
    if: inputs.confirmation == 'RUN_STAGE3_PUBLIC_EXTENDED_STABILITY' && inputs.production_restarts_ack == false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: stage3-public-guests
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run paced public ADCS cycles and 30-minute observation
        env:
          OWNER_CONFIRMATION: ${{ inputs.confirmation }}
          PRODUCTION_RESTARTS_ACK: ${{ inputs.production_restarts_ack }}
          PREMERGE_PHASE: ${{ inputs.premerge_phase }}
          PREMERGE_CANDIDATE_SHA: ${{ inputs.premerge_candidate_sha }}
        run: |
          python3 -m stage3.run run extended --sha "$GITHUB_SHA" --image ubuntu-24.04 \
            --output "$RUNNER_TEMP/bundles/stage3-extended-ubuntu-24.04-$GITHUB_RUN_ATTEMPT"
      - name: Verify and summarize the extended evidence
        if: '!cancelled()'
        run: |
          python3 -m stage3.run report --mode extended --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --input "$RUNNER_TEMP/bundles" --output "$RUNNER_TEMP/report"
      - name: Upload checksummed extended evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage3-extended-evidence-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bundles/
            ${{ runner.temp }}/report/
          if-no-files-found: error

  external-snapshot:
    name: OWNER before/after external snapshot
    needs: owner-gate
    if: inputs.confirmation == 'RUN_STAGE3_UBUNTU_EXTERNAL_ONLY' && inputs.production_restarts_ack == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: stage3-public-guests
      cancel-in-progress: false
    steps:
      - name: Install packaged ncdc
        run: |
          test "$RUNNER_ENVIRONMENT" = 'github-hosted'
          sudo -n apt-get -o Acquire::Retries=3 update -qq
          sudo -n apt-get install -y --no-install-recommends ncdc
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record public TLS, exposure, ncdc and two-guest snapshots
        env:
          OWNER_CONFIRMATION: ${{ inputs.confirmation }}
          PRODUCTION_RESTARTS_ACK: ${{ inputs.production_restarts_ack }}
          PREMERGE_PHASE: ${{ inputs.premerge_phase }}
          PREMERGE_CANDIDATE_SHA: ${{ inputs.premerge_candidate_sha }}
        run: |
          failed=0
          for group in tls-public exposure ncdc two-client-public; do
            python3 -m stage3.run run "$group" --sha "$GITHUB_SHA" --image ubuntu-24.04 \
              --output "$RUNNER_TEMP/snapshot/$group" || failed=1
          done
          exit "$failed"
      - name: Upload external-only snapshot evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage3-external-snapshot-${{ inputs.premerge_phase }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/snapshot/
          if-no-files-found: error
