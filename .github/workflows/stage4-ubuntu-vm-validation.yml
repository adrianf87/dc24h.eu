name: Stage IV five-distro Docker qualification

on:
  push:
    branches: [feature/stage4-webadmin-dedicated-service]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage4-docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker-application-sequential:
    name: Docker Debian 12/13 Ubuntu 22/24/26 (sequential)
    if: github.repository == 'adrianf87/dc24h.eu-twilight'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Run five isolated Docker containers in strict order
        run: bash self-hosted-runner/scripts/run-docker-sequential.sh

      - name: Upload per-distro status and test artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage4-docker-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dc24h-docker-results/
          if-no-files-found: warn
          retention-days: 14
