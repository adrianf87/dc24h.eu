name: Debian 13 Stage III public ADCS activation and rollback (OWNER only)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'activate (public TCP 1512) or rollback this Stage III service'
        required: true
        type: choice
        options: [activate, rollback]
      confirmation:
        description: 'Exact RUN_STAGE3_PUBLIC_ADCS_ACTIVATION or RUN_STAGE3_PUBLIC_ADCS_ROLLBACK'
        required: true
        type: string
      provider_tcp_1512_confirmed:
        description: 'OWNER verified provider TCP 1512 allowed, SSH access preserved'
        required: true
        type: boolean
        default: false
      tls_renewal_plan_confirmed:
        description: 'OWNER identified operator and renewal/restart plan for public TLS cert'
        required: true
        type: boolean
        default: false
      deployed_sha:
        description: 'For manual rollback after main has moved: full deployed SHA'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: twilight-debian13-stage3-public-activation
  cancel-in-progress: false

jobs:
  activate:
    name: Stage III guarded host install (public until external acceptance)
    if: github.repository == 'adrianf87/dc24h.eu-twilight' && github.actor == 'adrianf87' && github.ref == 'refs/heads/main' && inputs.mode == 'activate'
    runs-on: [self-hosted, linux, x64, twilight-debian13-stage2]
    timeout-minutes: 60
    env:
      EXPECTED_SHA: ${{ github.sha }}
      OWNER_CONFIRMATION: ${{ inputs.confirmation }}
      PROVIDER_ACK: ${{ inputs.provider_tcp_1512_confirmed }}
      RENEWAL_ACK: ${{ inputs.tls_renewal_plan_confirmed }}
      BUILD_DIR: ${{ runner.temp }}/stage3-public-adcs-${{ github.run_id }}
    steps:
      - name: Verify exact OWNER, main, dedicated runner and root identity
        shell: bash
        run: |
          set -euo pipefail
          test "$OWNER_CONFIRMATION" = 'RUN_STAGE3_PUBLIC_ADCS_ACTIVATION'
          test "$PROVIDER_ACK" = 'true'
          test "$RENEWAL_ACK" = 'true'
          test "$RUNNER_NAME" = 'server-747585786'
          test "$(id -un)" = 'github-runner'
          test "$(sudo -n id -u)" = '0'

      - name: Checkout exact main SHA without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact source and Stage III policy unit tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          (cd scripts && python3 -m unittest -v test_public_stage3_adcs_preflight.py test_public_stage3_adcs_activate.py test_public_stage3_external_probe.py)

      - name: Reconfirm all privileged read-only prerequisites immediately before install
        shell: bash
        run: |
          set -euo pipefail
          sudo -n python3 scripts/public_stage3_adcs_preflight.py \
            --expected-sha "$EXPECTED_SHA" --actor "$GITHUB_ACTOR" \
            --ref "$GITHUB_REF" --runner "$RUNNER_NAME" \
            --runner-user "$(id -un)" \
            --report "$RUNNER_TEMP/stage3-activation-preflight.json"

      - name: Build exact-head C++ hub unprivileged
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build "$BUILD_DIR" --parallel 4
          "$BUILD_DIR/dc24h-twilight" --version

      - name: OWNER-approved isolated systemd installation and public listener
        shell: bash
        run: |
          set -euo pipefail
          sudo -n python3 scripts/public_stage3_adcs_activate.py \
            --action activate --confirmation "$OWNER_CONFIRMATION" \
            --expected-sha "$EXPECTED_SHA" --actor "$GITHUB_ACTOR" \
            --ref "$GITHUB_REF" --runner "$RUNNER_NAME" --runner-user "$(id -un)" \
            --binary "$BUILD_DIR/dc24h-twilight" --provider-1512-confirmed \
            --tls-renewal-plan-confirmed

      - name: Save sanitized activation identity without private host data
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          printf '{"source_sha":"%s","scope":"STAGE3_ADCS_ONLY","port":1512,"external_acceptance":false,"webadmin_public":false}\n' "$EXPECTED_SHA" > "$RUNNER_TEMP/stage3-public-activation-summary.json"

      - name: Upload only bounded activation status
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: twilight-stage3-public-activation-host
          path: ${{ runner.temp }}/stage3-public-activation-summary.json
          if-no-files-found: ignore
          retention-days: 7

  external:
    name: Independent public CA/SAN TLS and two-guest login gate
    needs: [activate]
    if: github.repository == 'adrianf87/dc24h.eu-twilight' && github.actor == 'adrianf87' && github.ref == 'refs/heads/main' && inputs.mode == 'activate'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact tested source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify independent external ADCS DNS, CA, SAN, guest login and no ADC
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/public_stage3_external_probe.py
          printf '{"source_sha":"%s","scope":"EXTERNAL_TLS_GUEST_TWO_CLIENTS","result":"PASS"}\n' "$GITHUB_SHA" > "$RUNNER_TEMP/stage3-external-adcs-summary.json"

      - name: Upload bounded external acceptance summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: twilight-stage3-public-external-adcs
          path: ${{ runner.temp }}/stage3-external-adcs-summary.json
          if-no-files-found: ignore
          retention-days: 7

  auto-rollback:
    name: Stop and remove only our Stage III service after external FAIL
    needs: [activate, external]
    if: always() && github.repository == 'adrianf87/dc24h.eu-twilight' && github.actor == 'adrianf87' && github.ref == 'refs/heads/main' && inputs.mode == 'activate' && needs.activate.result == 'success' && needs.external.result != 'success'
    runs-on: [self-hosted, linux, x64, twilight-debian13-stage2]
    timeout-minutes: 15
    steps:
      - name: Checkout original deployed source without credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Root rollback on failed external acceptance
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = 'server-747585786'
          test "$(id -un)" = 'github-runner'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sudo -n python3 scripts/public_stage3_adcs_activate.py \
            --action rollback --confirmation RUN_STAGE3_PUBLIC_ADCS_ROLLBACK \
            --expected-sha "$GITHUB_SHA" --actor "$GITHUB_ACTOR" \
            --ref "$GITHUB_REF" --runner "$RUNNER_NAME" --runner-user "$(id -un)"

  manual-rollback:
    name: OWNER-only rollback of the exact recorded public Stage III deployment
    if: github.repository == 'adrianf87/dc24h.eu-twilight' && github.actor == 'adrianf87' && github.ref == 'refs/heads/main' && inputs.mode == 'rollback'
    runs-on: [self-hosted, linux, x64, twilight-debian13-stage2]
    timeout-minutes: 15
    env:
      OWNER_CONFIRMATION: ${{ inputs.confirmation }}
      DEPLOYED_SHA: ${{ inputs.deployed_sha }}
    steps:
      - name: Verify rollback OWNER confirmation and runner identity
        shell: bash
        run: |
          set -euo pipefail
          test "$OWNER_CONFIRMATION" = 'RUN_STAGE3_PUBLIC_ADCS_ROLLBACK'
          test "$RUNNER_NAME" = 'server-747585786'
          test "$(id -un)" = 'github-runner'
          test "$(sudo -n id -u)" = '0'
      - name: Checkout exact protected main rollback tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Stop Stage III service and remove only its owned files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$DEPLOYED_SHA"
          sudo -n python3 scripts/public_stage3_adcs_activate.py \
            --action rollback --confirmation "$OWNER_CONFIRMATION" \
            --expected-sha "$GITHUB_SHA" --deployed-sha "$DEPLOYED_SHA" \
            --actor "$GITHUB_ACTOR" --ref "$GITHUB_REF" \
            --runner "$RUNNER_NAME" --runner-user "$(id -un)"
