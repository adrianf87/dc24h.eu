name: Stage IV public WebAdmin design boundary (Ubuntu only)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/public-stage4-design.yml'
      - 'doc/us/PUBLIC_STAGE_IV_WEBADMIN_DESIGN.md'
      - 'doc/us/PUBLIC_STAGE_IV_WEBADMIN_IMPLEMENTATION.md'
      - 'doc/pl/PUBLIC_STAGE_IV_WEBADMIN_IMPLEMENTATION.md'
      - 'doc/pl/PUBLIC_STAGE_IV_WEBADMIN_DESIGN.md'
      - 'tests/public_stage4_boundary_tests.py'
      - 'webadmin/server/remote-main.ts'
      - 'webadmin/server/public-email-code.ts'
      - 'webadmin/server/public-email-enrollment.ts'
      - 'webadmin/server/public-email-enroll-main.ts'
      - 'webadmin/server/public-msmtp.ts'
      - 'webadmin/server/public-verified-email.ts'
      - 'webadmin/server/public-backend.ts'
      - 'webadmin/server/public-bridge-credentials.ts'
      - 'webadmin/server/public-gateway.ts'
      - 'webadmin/server/public-main.ts'
      - 'webadmin/server/stage4-*.ts'
      - 'webadmin/tests/stage4-mariadb.integration.ts'
      - 'database/stage4/**'
      - 'config/stage4-webadmin-bootstrap.env.example'
      - 'config/dc24h-twilight-stage4-auth.service.example'
      - 'scripts/dc24h-stage4-init'
      - 'scripts/stage4_install.sh'
      - 'scripts/stage4_test_database.sh'
      - 'tests/stage4_msmtp_process.py'
      - 'src/account_admin.cpp'
      - 'src/owner_admin.cpp'
      - 'src/accounts/management.cpp'
      - 'webadmin/server/public-private-init.ts'
      - 'webadmin/tests/public-email-code.test.ts'
      - 'webadmin/tests/public-email-enrollment.test.ts'
      - 'webadmin/tests/public-email-gateway.test.ts'
      - 'webadmin/tests/public-verified-email.test.ts'
      - 'webadmin/tests/public-backend.test.ts'
      - 'webadmin/tests/public-dedicated-service.test.ts'
      - 'webadmin/tests/public-stage4.spec.ts'
      - 'webadmin/public-stage4/**'
      - 'config/dc24h-twilight-stage4-webadmin.service.example'
      - 'config/dc24h-twilight-stage4-bridge.service.example'
      - 'config/dc24h-stage4-webadmin.sysusers.example'
      - 'scripts/stage4_webadmin_bridge.py'
      - 'tests/stage4_webadmin_bridge_tests.py'
      - 'doc/us/STAGE_IV_EMAIL_ENROLLMENT.md'
      - 'doc/pl/STAGE_IV_EMAIL_ENROLLMENT.md'
      - 'doc/us/STAGE_IV_DEDICATED_SERVICE.md'
      - 'doc/pl/STAGE_IV_DEDICATED_SERVICE.md'
      - 'include/dc24h/api/accounts.hpp'
      - 'src/api/accounts.cpp'
      - 'src/main.cpp'
      - 'tests/account_webadmin_tests.cpp'
      - 'tests/beta06_authenticated_api_process_tests.py'
      - 'tests/stage4_vps_preflight_tests.py'
      - 'scripts/stage4_vps_preflight.py'
      - 'CMakeLists.txt'
      - 'webadmin/package.json'
      - 'webadmin/package-lock.json'
      - 'config/apache2-webadmin-remote.conf.example'
      - 'config/apache2-webadmin-public.conf.example'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design-boundary:
    name: Offline Stage IV scope and private gateway regression / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Confirm disposable GitHub runner
        run: |
          test "$RUNNER_ENVIRONMENT" = 'github-hosted'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify design boundaries without network or sudo
        run: |
          python3 -m unittest discover -s tests -p 'public_stage4_boundary_tests.py' -v
          python3 -m unittest discover -s tests -p 'stage4_vps_preflight_tests.py' -v
          python3 -m unittest discover -s tests -p 'stage4_webadmin_bridge_tests.py' -v
          python3 tests/project_checks.py
          python3 tests/project_language_policy_tests.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webadmin/package-lock.json
      - name: Test password plus verified email code and TypeScript policy
        working-directory: webadmin
        run: |
          npm ci --no-audit --no-fund
          node --import tsx --test tests/public-email-code.test.ts tests/public-email-enrollment.test.ts tests/public-email-gateway.test.ts tests/public-verified-email.test.ts tests/public-backend.test.ts tests/public-dedicated-service.test.ts
          node --check public-stage4/panel.js
          npm run build:public:ci
          npm run build:enrollment:ci
          npm run build:stage4-init
          npm run typecheck

  playwright-shell:
    name: Standalone Stage IV browser/CSRF flow (hosted Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Confirm disposable GitHub runner
        run: test "$RUNNER_ENVIRONMENT" = 'github-hosted'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webadmin/package-lock.json
      - name: Install isolated test browser
        working-directory: webadmin
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run isolated public browser tests; never contact the VPS
        working-directory: webadmin
        run: npx playwright test tests/public-stage4.spec.ts

  dedicated-systemd:
    name: Isolated non-root Unix bridge / systemd sandbox (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Confirm disposable GitHub Ubuntu runner and passwordless systemd
        run: |
          test "$RUNNER_ENVIRONMENT" = 'github-hosted'
          test "$(id -u)" != '0'
          test "$(sudo -n id -u)" = '0'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Execute real AF_UNIX peer tests inside non-root systemd sandbox
        run: |
          # The repository test code executes as nobody, never as root.
          # PrivateNetwork isolates this synthetic fixture from the VPS.
          fixture=$(mktemp -d /var/tmp/dc24h-stage4-ci.XXXXXXXX)
          trap 'rm -rf -- "$fixture"' EXIT
          install -d -m 0755 "$fixture/scripts" "$fixture/tests"
          install -m 0644 scripts/stage4_webadmin_bridge.py "$fixture/scripts/"
          install -m 0644 tests/stage4_webadmin_bridge_tests.py "$fixture/tests/"
          chmod 0755 "$fixture"
          sudo -n -u nobody test -r "$fixture/tests/stage4_webadmin_bridge_tests.py"
          sudo -n systemd-run --wait --pipe --collect \
            --property=User=nobody --property=NoNewPrivileges=yes \
            --property=PrivateNetwork=yes --property=ProtectSystem=strict \
            --property=TemporaryFileSystem=/tmp:rw,mode=1777 \
            --property="WorkingDirectory=$fixture" \
            /usr/bin/python3 -B -m unittest discover -s tests -p 'stage4_webadmin_bridge_tests.py' -v

  mariadb-qualification:
    name: Disposable Stage IV MariaDB and C++ authentication / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Confirm hosted runner
        run: test "$RUNNER_ENVIRONMENT" = 'github-hosted'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install signed Ubuntu build and database packages
        run: |
          source_file=/etc/apt/sources.list.d/ubuntu.sources
          if [ ! -r "$source_file" ]; then source_file=/etc/apt/sources.list; fi
          options=(-o "Dir::Etc::sourcelist=$source_file" -o Dir::Etc::sourceparts=- -o Acquire::Retries=3)
          sudo -n apt-get "${options[@]}" update -qq
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get "${options[@]}" install -y --no-install-recommends \
            cmake g++ libssl-dev libgcrypt20-dev libutf8proc-dev libmariadb-dev mariadb-server apache2 msmtp
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webadmin/package-lock.json
      - name: Compile the native account executables
        run: |
          cmake -S . -B "$RUNNER_TEMP/stage4-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/stage4-build" --parallel "$(nproc)" --target dc24h dc24h-owner dc24h-account-admin
      - name: Run privileged bootstrap only against the disposable database fixture
        run: |
          node_dir=$(dirname "$(dirname "$(command -v node)")")
          sudo -n ./scripts/stage4_install.sh "$node_dir" "$RUNNER_TEMP/stage4-build"
          sudo -n env "PATH=$node_dir/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/bin" ./scripts/stage4_test_database.sh
          python3 tests/stage4_msmtp_process.py -v
