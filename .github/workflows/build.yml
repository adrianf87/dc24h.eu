name: Check status

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix, alpha-0.8.7, alpha-0.8.8, alpha-0.8.9, alpha-0.8.10, alpha-0.8.11, alpha-0.8.12, alpha-0.8.13, alpha-0.8.14, alpha-0.8.15, alpha-0.9.1, alpha-0.9.2, alpha-0.9.3, alpha-0.9.4, alpha-0.9.5, alpha-0.9.6, alpha-0.9.7, alpha-0.9.8, alpha-0.9.9, alpha-0.9.10, alpha-0.9.11, alpha-0.9.12, alpha-0.9.13, alpha-0.9.14, alpha-0.9.15, alpha-0.9.16, alpha-0.9.17, beta-0.1, beta-0.1.8, beta-0.2, beta-0.2.1, beta-0.2-code, beta-0.2.2-source, beta-0.2.2-fix, beta-0.2.3, docs/beta-0.2.3-unified-description, beta-0.2.4, beta-0.2.5, beta-0.2.6, beta-0.2.7-beta-0.2.12-finish, beta-0.3.1-12-full, beta-0.4.1-0.4.4-stage1, beta-0.4.5, beta-0.4.6, beta-0.4.7, beta-0.4.8, beta-0.4.5-0.4.8-stage2, beta-0.4.9-0.4.12-stage3, beta-0.4.13-0.4.16-stage4]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dc24h-github-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cpp:
    name: C++ ${{ matrix.build_type }} - ${{ matrix.os }}
    if: github.repository == 'adrianf87/dc24h.eu' || github.repository == 'adrianf87/dc24h.eu-high-starter'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
        build_type: [Debug, Release]
    env:
      CXX: g++
      CI: 'true'
      BUILD_TYPE: ${{ matrix.build_type }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install build and integration dependencies
        run: |
          bash .github/scripts/install-ci-deps.sh \
            build-essential cmake python3 libutf8proc-dev libgcrypt20-dev \
            libssl-dev libmariadb-dev openssl ncdc mariadb-server apache2

      - name: Configure C++20
        run: cmake -S . -B "build/$BUILD_TYPE" -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DBUILD_TESTING=ON -DDC24H_REQUIRE_INTEGRATION_TESTS=ON

      - name: Build
        run: cmake --build "build/$BUILD_TYPE" --parallel 2

      - name: Test
        run: ctest --test-dir "build/$BUILD_TYPE" --parallel 2 --output-on-failure --output-junit "$RUNNER_TEMP/ctest.xml"

      - name: Prepare redacted CTest evidence
        if: always()
        run: python3 scripts/ci_junit_summary.py --junit "$RUNNER_TEMP/ctest.xml" --output "$RUNNER_TEMP/evidence/summary.json" --suite "cpp-${{ matrix.os }}-${{ matrix.build_type }}" --sha "$SOURCE_SHA"

      - name: Upload immutable status artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cpp-${{ matrix.os }}-${{ matrix.build_type }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence/summary.json
          if-no-files-found: error
          retention-days: 14

  webadmin:
    name: WebAdmin - ${{ matrix.os }}
    if: github.repository == 'adrianf87/dc24h.eu' || github.repository == 'adrianf87/dc24h.eu-high-starter'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    env:
      CXX: g++
      CI: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install C++ API build dependencies
        run: |
          bash .github/scripts/install-ci-deps.sh \
            build-essential cmake python3 libutf8proc-dev libgcrypt20-dev \
            libssl-dev libmariadb-dev

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webadmin/package-lock.json

      - name: Build Release C++ API for browser integration
        run: |
          cmake -S . -B build/Release -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build/Release --target dc24h --parallel 2

      - name: Install frontend dependencies
        working-directory: webadmin
        run: npm ci

      - name: Audit production npm dependencies for high-severity advisories
        working-directory: webadmin
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck and production build
        working-directory: webadmin
        run: npm run build

      - name: Frontend unit tests
        working-directory: webadmin
        run: node --import tsx --test --test-concurrency=2 tests/*.test.ts

      - name: Install Chromium and system dependencies
        working-directory: webadmin
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        working-directory: webadmin
        run: npm run test:e2e -- --workers=2 --fully-parallel

      - name: Real C++ API integration
        working-directory: webadmin
        run: npm run test:integration -- ../build/Release/dc24h

  sanitizers:
    name: C++ ${{ matrix.sanitizer }} - ubuntu-24.04
    if: github.repository == 'adrianf87/dc24h.eu' || github.repository == 'adrianf87/dc24h.eu-high-starter'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    env:
      CXX: g++
      CI: 'true'
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install C++ dependencies
        run: |
          bash .github/scripts/install-ci-deps.sh \
            build-essential cmake python3 libutf8proc-dev libgcrypt20-dev \
            libssl-dev libmariadb-dev

      - name: Configure isolated sanitizer build
        run: cmake -S . -B "build/sanitizer-${{ matrix.sanitizer }}" -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DDC24H_SANITIZER="${{ matrix.sanitizer }}"

      - name: Build instrumented unit tests
        run: cmake --build "build/sanitizer-${{ matrix.sanitizer }}" --parallel 2

      - name: Run sanitizer and security regression subset
        run: ctest --test-dir "build/sanitizer-${{ matrix.sanitizer }}" --output-on-failure --output-junit "$RUNNER_TEMP/ctest.xml" -R '^(memory\.safety|adc\.security|security\.unit|api\.unit|beta\.baseline)$'

      - name: Prepare redacted sanitizer evidence
        if: always()
        run: python3 scripts/ci_junit_summary.py --junit "$RUNNER_TEMP/ctest.xml" --output "$RUNNER_TEMP/evidence/summary.json" --suite "sanitizer-${{ matrix.sanitizer }}" --sha "$SOURCE_SHA"

      - name: Upload immutable sanitizer status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sanitizer-${{ matrix.sanitizer }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence/summary.json
          if-no-files-found: error
          retention-days: 14

  debian_compat:
    name: Debian ${{ matrix.release }} - compatibility smoke
    if: github.repository == 'adrianf87/dc24h.eu-high-starter'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        release: [bookworm, trixie]
    container:
      image: debian:${{ matrix.release }}
    env:
      CI: 'true'
      CXX: g++
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Debian build and integration dependencies
        run: |
          bash .github/scripts/install-ci-deps.sh \
            build-essential cmake python3 libutf8proc-dev libgcrypt20-dev \
            libssl-dev libmariadb-dev openssl ncdc mariadb-server apache2

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webadmin/package-lock.json

      - name: Build Debian C++20 binaries and tests
        run: |
          cmake -S . -B build/Debian -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/Debian --parallel 2
          python3 scripts/compatibility_fixture_gate.py --build-dir build/Debian

      - name: Real Debian integration smoke without systemd-host claims
        run: |
          ctest --test-dir build/Debian --parallel 2 --output-on-failure \
            --output-junit "$RUNNER_TEMP/ctest.xml" \
            -R '^(database\.(process|resilience\.process|migrations\.process)|apache2\.(https|remote\.gateway)|api\.process|adc\.process|adcs\.process|beta\.04\.stage4\.vm\.probe|project\.metadata|compatibility\.fixture\.gate|ci\.junit\.summary)$'

      - name: Verify WebAdmin TypeScript, Vite and unit tests on Debian
        working-directory: webadmin
        run: |
          npm ci
          npm run build
          node --import tsx --test --test-concurrency=2 tests/*.test.ts

      - name: Prepare Debian evidence
        if: always()
        run: python3 scripts/ci_junit_summary.py --junit "$RUNNER_TEMP/ctest.xml" --output "$RUNNER_TEMP/evidence/summary.json" --suite "debian-${{ matrix.release }}" --sha "$SOURCE_SHA"

      - name: Upload immutable Debian smoke status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: debian-${{ matrix.release }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence/summary.json
          if-no-files-found: error
          retention-days: 14

  required_ci:
    # Preserve the required check name configured by branch protection.
    name: CI (C++ and WebAdmin)
    needs: [cpp, webadmin, sanitizers, debian_compat]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Ensure all C++ and WebAdmin checks passed
        env:
          CPP_RESULT: ${{ needs.cpp.result }}
          WEBADMIN_RESULT: ${{ needs.webadmin.result }}
          SANITIZERS_RESULT: ${{ needs.sanitizers.result }}
          DEBIAN_RESULT: ${{ needs.debian_compat.result }}
        run: |
          test "$CPP_RESULT" = "success"
          test "$WEBADMIN_RESULT" = "success"
          test "$SANITIZERS_RESULT" = "success"
          test "$DEBIAN_RESULT" = "success"
