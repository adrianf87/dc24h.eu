name: Check status
on:
  push:
    branches: [main, 'alpha-0.7.*']
  pull_request:
    branches: [main, 'alpha-0.7.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dc24h-server-747585786
  cancel-in-progress: false
jobs:
  server:
    name: server-747585786 - Ubuntu 24.04
    if: >-
      github.repository == 'adrianf87/dc24h.eu' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, server-747585786]
    timeout-minutes: 180
    env:
      CXX: g++
      CI: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify provisioned runner and integration tools
        shell: bash
        run: |
          test "$RUNNER_NAME" = server-747585786
          test "$(id -un)" = github-runner
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          for tool in g++ cmake python3 openssl ncdc mariadbd mariadb mariadb-admin mariadb-install-db apache2; do
            command -v "$tool"
          done
      - name: Build and test C++20 Debug and Release
        shell: bash
        run: |
          for build_type in Debug Release; do
            cmake -S . -B "build/$build_type" -DCMAKE_BUILD_TYPE="$build_type" \
              -DBUILD_TESTING=ON -DDC24H_REQUIRE_INTEGRATION_TESTS=ON
            cmake --build "build/$build_type" --parallel "$(nproc)"
            ctest --test-dir "build/$build_type" --parallel "$(nproc)" --output-on-failure
          done
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webadmin/package-lock.json
      - name: Install frontend dependencies
        working-directory: webadmin
        run: npm ci
      - name: Typecheck and production build
        working-directory: webadmin
        run: npm run build
      - name: Frontend unit tests
        working-directory: webadmin
        run: node --import tsx --test --test-concurrency="$(nproc)" tests/*.test.ts
      - name: Install Chromium
        working-directory: webadmin
        run: npx playwright install chromium
      - name: Browser tests
        working-directory: webadmin
        run: npm run test:e2e -- --workers="$(nproc)" --fully-parallel
      - name: Real C++ API integration
        working-directory: webadmin
        run: npm run test:integration -- ../build/Release/dc24h
      - name: Retain test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/*/Testing/Temporary/LastTest.log
            webadmin/playwright-report/
          retention-days: 7
