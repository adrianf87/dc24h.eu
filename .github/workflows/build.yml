name: Build and test dc24h.eu
on: [push, pull_request]
permissions:
  contents: read
jobs:
  server:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install server dependencies and integration-test tools
        run: sudo apt-get update && sudo apt-get install -y libutf8proc-dev libssl-dev openssl ncdc libmariadb-dev mariadb-server apache2
      - name: Configure C++20
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DDC24H_REQUIRE_INTEGRATION_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  webadmin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webadmin/package-lock.json
      - name: Install C++ integration dependencies
        run: sudo apt-get update && sudo apt-get install -y libutf8proc-dev libssl-dev libmariadb-dev
      - name: Build integration server
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF && cmake --build build --parallel 2
      - name: Install frontend dependencies
        working-directory: webadmin
        run: npm ci
      - name: Typecheck and production build
        working-directory: webadmin
        run: npm run build
      - name: Unit tests
        working-directory: webadmin
        run: npm test
      - name: Install Chromium
        working-directory: webadmin
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: webadmin
        run: npm run test:e2e
      - name: Real C++ API integration
        working-directory: webadmin
        run: npm run test:integration -- ../build/dc24h
