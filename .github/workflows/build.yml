name: Check status

on:
  push:
    branches: [main, alpha-0.8.7, alpha-0.8.8]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dc24h-eu-docker-host-sequential
  cancel-in-progress: false

jobs:
  debian13:
    name: dc24h.eu Debian 13 host - C++ and WebAdmin tests
    if: github.repository == 'adrianf87/dc24h.eu'
    runs-on: [self-hosted, Linux, X64, server-747585786]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Debian 13 host - C++ Debug/Release and WebAdmin
        id: debian13
        env:
          CI: true
          CXX: g++
        run: bash .github/scripts/run-debian13-host.sh

      - name: Summarize the Debian 13 host result
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          echo '## dc24h.eu Debian 13 host' >> "$GITHUB_STEP_SUMMARY"
          echo '- Debian 13: ${{ steps.debian13.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          test '${{ steps.debian13.outcome }}' = success
