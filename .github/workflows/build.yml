name: Check status
on:
  push:
    branches: [main, alpha-0.7.8, alpha-0.7.9, alpha-0.7.10, alpha-0.7.11, alpha-0.7.12, alpha-0.7.13, alpha-0.7.14, alpha-0.7.15, alpha-0.8.1, alpha-0.8.2, alpha-0.8.3, alpha-0.8.4, alpha-0.8.5, alpha-0.8.6, alpha-0.8.7, alpha-0.8.8]
  pull_request:
    branches: [main, alpha-0.7.8, alpha-0.7.9, alpha-0.7.10, alpha-0.7.11, alpha-0.7.12, alpha-0.7.13, alpha-0.7.14, alpha-0.7.15, alpha-0.8.1, alpha-0.8.2, alpha-0.8.3, alpha-0.8.4, alpha-0.8.5, alpha-0.8.6, alpha-0.8.7, alpha-0.8.8]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dc24h-server-747585786-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cpp:
    name: C++ ${{ matrix.build_type }} - server-747585786
    if: >-
      github.repository == 'adrianf87/dc24h.eu' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, server-747585786]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    env:
      CXX: g++
      CI: 'true'
      BUILD_TYPE: ${{ matrix.build_type }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify custom runner server-747585786
        shell: bash
        run: |
          test "$RUNNER_NAME" = server-747585786
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          for tool in g++ cmake python3 openssl ncdc mariadbd mariadb mariadb-admin mariadb-install-db apache2; do
            command -v "$tool"
          done
      - name: Configure C++20
        run: cmake -S . -B "build/$BUILD_TYPE" -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DBUILD_TESTING=ON -DDC24H_REQUIRE_INTEGRATION_TESTS=ON
      - name: Build
        run: cmake --build "build/$BUILD_TYPE" --parallel "$(nproc)"
      - name: Test
        run: ctest --test-dir "build/$BUILD_TYPE" --parallel "$(nproc)" --output-on-failure

  webadmin:
    name: WebAdmin - server-747585786
    if: >-
      github.repository == 'adrianf87/dc24h.eu' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, server-747585786]
    timeout-minutes: 60
    env:
      CXX: g++
      CI: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify custom runner server-747585786
        shell: bash
        run: |
          test "$RUNNER_NAME" = server-747585786
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          for tool in g++ cmake python3 openssl; do
            command -v "$tool"
          done
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webadmin/package-lock.json
      - name: Build Release C++ API for browser integration
        run: |
          cmake -S . -B build/Release -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build/Release --target dc24h --parallel "$(nproc)"
      - name: Install frontend dependencies
        working-directory: webadmin
        run: npm ci
      - name: Typecheck and production build
        working-directory: webadmin
        run: npm run build
      - name: Frontend unit tests
        working-directory: webadmin
        run: node --import tsx --test --test-concurrency="$(nproc)" tests/*.test.ts
      - name: Install Chromium
        working-directory: webadmin
        run: npx playwright install chromium
      - name: Browser tests
        working-directory: webadmin
        run: npm run test:e2e -- --workers="$(nproc)" --fully-parallel
      - name: Real C++ API integration
        working-directory: webadmin
        run: npm run test:integration -- ../build/Release/dc24h
