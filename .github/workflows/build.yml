name: Check status
on:
  push:
    branches: [main, alpha-0.7.8]
  pull_request:
    branches: [main, alpha-0.7.8]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dc24h-github-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cpp:
    name: C++ ${{ matrix.build_type }} - Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    env:
      CXX: g++
      CI: 'true'
      BUILD_TYPE: ${{ matrix.build_type }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install build and integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake python3 libutf8proc-dev libgcrypt20-dev \
            libssl-dev libmariadb-dev openssl ncdc mariadb-server apache2
      - name: Configure C++20
        run: cmake -S . -B "build/$BUILD_TYPE" -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DBUILD_TESTING=ON -DDC24H_REQUIRE_INTEGRATION_TESTS=ON
      - name: Build
        run: cmake --build "build/$BUILD_TYPE" --parallel "$(nproc)"
      - name: Test
        run: ctest --test-dir "build/$BUILD_TYPE" --parallel "$(nproc)" --output-on-failure

  webadmin:
    name: WebAdmin - Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CXX: g++
      CI: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install C++ API build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake python3 libutf8proc-dev libgcrypt20-dev \
            libssl-dev libmariadb-dev
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webadmin/package-lock.json
      - name: Build Release C++ API for browser integration
        run: |
          cmake -S . -B build/Release -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build/Release --target dc24h --parallel "$(nproc)"
      - name: Install frontend dependencies
        working-directory: webadmin
        run: npm ci
      - name: Typecheck and production build
        working-directory: webadmin
        run: npm run build
      - name: Frontend unit tests
        working-directory: webadmin
        run: node --import tsx --test --test-concurrency="$(nproc)" tests/*.test.ts
      - name: Install Chromium and system dependencies
        working-directory: webadmin
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: webadmin
        run: npm run test:e2e -- --workers="$(nproc)" --fully-parallel
      - name: Real C++ API integration
        working-directory: webadmin
        run: npm run test:integration -- ../build/Release/dc24h
