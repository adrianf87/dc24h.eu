name: Check status

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix, alpha-0.8.7, alpha-0.8.8, alpha-0.8.9, alpha-0.8.10, alpha-0.8.11, alpha-0.8.12, alpha-0.8.13, alpha-0.8.14, alpha-0.8.15, alpha-0.9.1, alpha-0.9.2, alpha-0.9.3, alpha-0.9.4, alpha-0.9.5, alpha-0.9.6, alpha-0.9.7, alpha-0.9.8, alpha-0.9.9, alpha-0.9.10, alpha-0.9.11, alpha-0.9.12, alpha-0.9.13, alpha-0.9.14, alpha-0.9.15, alpha-0.9.16, alpha-0.9.17, beta-0.1, beta-0.1.8, beta-0.2, beta-0.2.1, beta-0.2-code, beta-0.2.2-source, beta-0.2.2-fix, beta-0.2.3, docs/beta-0.2.3-unified-description, beta-0.2.4, beta-0.2.5, beta-0.2.6, beta-0.2.7-beta-0.2.12-finish, beta-0.3.1-12-full, beta-0.4.1-0.4.4-stage1, beta-0.4.5, beta-0.4.6, beta-0.4.7, beta-0.4.8, beta-0.4.5-0.4.8-stage2, beta-0.4.9-0.4.12-stage3, beta-0.4.13-0.4.16-stage4, beta-0.9.x-stage-full-fix-pass]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dc24h-github-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker_application:
    name: C++ and WebAdmin / five Docker distros sequentially
    if: github.repository == 'adrianf87/dc24h.eu' || github.repository == 'adrianf87/dc24h.eu-high-starter' || github.repository == 'adrianf87/dc24h.eu-twilight'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checked-out commit
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: C++ / CTest / sanitizers / WebAdmin / Playwright on five Docker distros
        run: bash self-hosted-runner/scripts/run-docker-sequential.sh

      - name: Upload per-distribution test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpp-webadmin-five-distros-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dc24h-docker-results/
          if-no-files-found: warn
          retention-days: 14

  required_ci:
    # Keep the check name expected by the repository ruleset.
    name: CI (C++ and WebAdmin)
    needs: [docker_application]
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Require all five Docker distributions to pass
        env:
          DOCKER_RESULT: ${{ needs.docker_application.result }}
        run: test "$DOCKER_RESULT" = 'success'
