name: Build and test dc24h.eu
on: [push, pull_request]
permissions:
  contents: read
jobs:
  server:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        build_type: [Debug, Release]
    runs-on: [self-hosted, Linux, X64, server-747585786, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v6
      - name: Check pre-provisioned server dependencies
        run: python3 scripts/ci/runner_dependencies.py check server
      - name: Configure C++20
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DDC24H_REQUIRE_INTEGRATION_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  webadmin:
    runs-on: [self-hosted, Linux, X64, server-747585786, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webadmin/package-lock.json
      - name: Check pre-provisioned WebAdmin dependencies
        run: python3 scripts/ci/runner_dependencies.py check webadmin
      - name: Build integration server
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF && cmake --build build --parallel 2
      - name: Install frontend dependencies
        working-directory: webadmin
        run: npm ci
      - name: Typecheck and production build
        working-directory: webadmin
        run: npm run build
      - name: Unit tests
        working-directory: webadmin
        run: npm test
      - name: Install Chromium
        working-directory: webadmin
        run: npx playwright install chromium
      - name: Browser tests
        working-directory: webadmin
        run: npm run test:e2e
      - name: Real C++ API integration
        working-directory: webadmin
        run: npm run test:integration -- ../build/dc24h
