name: Build and test Core, Network, ADC, ADCS, Configuration, Logging, Security, Database and API
on: [push, pull_request]
permissions:
  contents: read
jobs:
  server:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install server dependencies and integration-test tools
        run: sudo apt-get update && sudo apt-get install -y libutf8proc-dev libssl-dev openssl ncdc libmariadb-dev mariadb-server
      - name: Configure C++20
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
