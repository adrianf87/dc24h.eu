name: Check status

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/stage4-webadmin-dedicated-service]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: dc24h-ubuntu-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  application:
    name: C++ CTest and WebAdmin / ${{ matrix.os }}
    if: github.repository == 'adrianf87/dc24h.eu' || github.repository == 'adrianf87/dc24h.eu-high-starter' || github.repository == 'adrianf87/dc24h.eu-twilight'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify GitHub-hosted Ubuntu image and exact checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_IMAGE: ${{ matrix.os }}
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          . /etc/os-release
          test "$ID" = ubuntu && test "$VERSION_ID" = "${EXPECTED_IMAGE#ubuntu-}"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Install Ubuntu C++ and integration dependencies
        run: |
          bash .github/scripts/install-ci-deps.sh \
            build-essential cmake python3 libutf8proc-dev libgcrypt20-dev libssl-dev \
            libmariadb-dev mariadb-server apache2 openssl ncdc msmtp certbot pebble iproute2
      - name: Compile all C++ targets and run CTest
        env:
          DC24H_REQUIRE_SYSTEMD_HOST: '1'
        run: |
          cmake -S . -B "$RUNNER_TEMP/dc24h-build" -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON -DDC24H_REQUIRE_INTEGRATION_TESTS=ON
          cmake --build "$RUNNER_TEMP/dc24h-build" --parallel 4
          ctest --test-dir "$RUNNER_TEMP/dc24h-build" --output-on-failure \
            --parallel 4 --timeout 180
      - name: Qualify TLS renewal with a disposable CA and systemd
        run: |
          sudo -n systemctl disable --now certbot.timer
          sudo -n unshare --mount --net --propagation private -- /usr/bin/python3 \
            tests/tls_renewal_acme_tests.py "$RUNNER_TEMP/dc24h-build/dc24h-twilight" /usr/bin/pebble
          sudo -n env "GITHUB_ACTIONS=$GITHUB_ACTIONS" "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" \
            /usr/bin/python3 tests/tls_renewal_systemd_tests.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webadmin/package-lock.json
      - name: Build and test WebAdmin including Stage IV
        working-directory: webadmin
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run build:remote:ci
          npm run build:public:ci
          npm run build:enrollment:ci
          npm run build:stage4-init
          npm test
          npm audit --omit=dev --audit-level=high
      - name: Test Chromium browser flows
        working-directory: webadmin
        run: |
          # Hosted Ubuntu images already carry browser system libraries. Avoid
          # Playwright's unscoped apt update (third-party feeds can return 403).
          npx playwright install chromium
          npm run test:e2e
          npm run test:integration -- "$RUNNER_TEMP/dc24h-build/dc24h"
      - name: Run Python source and Stage IV policy tests
        run: |
          python3 tests/project_checks.py
          python3 tests/project_language_policy_tests.py
          python3 -m unittest discover -s tests -p 'public_stage4_boundary_tests.py' -v
          python3 -m unittest discover -s tests -p 'stage4_vps_preflight_tests.py' -v
          python3 -m unittest discover -s tests -p 'stage4_webadmin_bridge_tests.py' -v

  sanitizers:
    name: C++ sanitizer ${{ matrix.sanitizer }} / ${{ matrix.os }}
    if: github.repository == 'adrianf87/dc24h.eu' || github.repository == 'adrianf87/dc24h.eu-high-starter' || github.repository == 'adrianf87/dc24h.eu-twilight'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
        sanitizer: [address, undefined]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify GitHub-hosted Ubuntu image
        env:
          EXPECTED_IMAGE: ${{ matrix.os }}
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          . /etc/os-release
          test "$ID" = ubuntu && test "$VERSION_ID" = "${EXPECTED_IMAGE#ubuntu-}"
      - name: Install Ubuntu native dependencies
        run: |
          bash .github/scripts/install-ci-deps.sh \
            build-essential cmake python3 libutf8proc-dev libgcrypt20-dev \
            libssl-dev libmariadb-dev
      - name: Compile and test under sanitizer
        run: |
          cmake -S . -B "$RUNNER_TEMP/dc24h-sanitizer" -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON -DDC24H_SANITIZER=${{ matrix.sanitizer }}
          cmake --build "$RUNNER_TEMP/dc24h-sanitizer" --parallel 4
          ctest --test-dir "$RUNNER_TEMP/dc24h-sanitizer" --output-on-failure \
            --parallel 2 --timeout 180

  required_ci:
    name: CI (C++ and WebAdmin)
    needs: [application, sanitizers]
    if: ${{ !cancelled() }}
    # The final required check still fails closed when a preceding job fails.
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require all Ubuntu 22.04 24.04 and 26.04 tests to pass
        env:
          APPLICATION_RESULT: ${{ needs.application.result }}
          SANITIZERS_RESULT: ${{ needs.sanitizers.result }}
        run: |
          test "$APPLICATION_RESULT" = success
          test "$SANITIZERS_RESULT" = success
