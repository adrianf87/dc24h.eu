name: Check status
on:
  push:
    branches: [main, alpha-0.7.4, alpha-0.7.5]
  pull_request:
    branches: [main, alpha-0.7.4, alpha-0.7.5]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dc24h-proxmox-vms-200-201
  cancel-in-progress: false
jobs:
  vm200:
    name: VM 200 - Ubuntu 24.04
    if: >-
      github.repository == 'adrianf87/dc24h.eu' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: adrianf87/dc24h.eu/.github/workflows/proxmox-vm.yml@20ca46bd5f297a98bbbbe59604bcb0a041839b6d
    with:
      runner: proxmox-worker-2
      ubuntu: '24.04'
      cxx: g++

  vm201:
    name: VM 201 - Ubuntu 22.04
    needs: vm200
    if: ${{ !cancelled() && needs.vm200.result != 'skipped' }}
    uses: adrianf87/dc24h.eu/.github/workflows/proxmox-vm.yml@20ca46bd5f297a98bbbbe59604bcb0a041839b6d
    with:
      runner: proxmox-worker-3
      ubuntu: '22.04'
      cxx: g++-12
