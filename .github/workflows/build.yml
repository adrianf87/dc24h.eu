name: Check status
on:
  push:
    branches: [main, alpha-0.7.8, alpha-0.7.9, alpha-0.7.10, alpha-0.7.11, alpha-0.7.12, alpha-0.7.13, alpha-0.7.14, alpha-0.7.15, alpha-0.8.1, alpha-0.8.2, alpha-0.8.3, alpha-0.8.4, alpha-0.8.5, alpha-0.8.6, alpha-0.8.7, alpha-0.8.8]
  pull_request:
    branches: [main, alpha-0.7.8, alpha-0.7.9, alpha-0.7.10, alpha-0.7.11, alpha-0.7.12, alpha-0.7.13, alpha-0.7.14, alpha-0.7.15, alpha-0.8.1, alpha-0.8.2, alpha-0.8.3, alpha-0.8.4, alpha-0.8.5, alpha-0.8.6, alpha-0.8.7, alpha-0.8.8]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dc24h-server-747585786-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  containers:
    name: Docker containers - server-747585786
    if: >-
      github.repository == 'adrianf87/dc24h.eu' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, server-747585786]
    timeout-minutes: 360
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify host runner server-747585786
        shell: bash
        run: |
          test "$RUNNER_NAME" = server-747585786
          test "$(id -un)" = github-runner
          . /etc/os-release
          test "$ID" = debian
          test "$VERSION_ID" = 13
          docker version
          id -nG | tr ' ' '\n' | grep -Fx docker
          for container in ubuntu2204-github-runner ubuntu2404-github-runner ubuntu2604-github-runner debian12-github-runner debian13-github-runner; do
            docker container inspect "$container" >/dev/null
            test "$(docker inspect -f '{{.State.Running}}' "$container")" = false
          done
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check one container at a time, then stop it
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          while read -r container os version; do
            echo "=== $container ($os $version): 16 threads, 32 GiB ==="
            if ! bash .github/scripts/run-one-container.sh "$container" "$os" "$version"; then
              echo "::error::$container failed"
              failed=1
            fi
          done <<'EOF'
          ubuntu2204-github-runner ubuntu 22.04
          ubuntu2404-github-runner ubuntu 24.04
          ubuntu2604-github-runner ubuntu 26.04
          debian12-github-runner debian 12
          debian13-github-runner debian 13
          EOF
          exit "$failed"
