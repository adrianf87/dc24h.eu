name: Debian 13 Stage III public ADCS read-only preflight (OWNER only)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RUN_STAGE3_ADCS_READ_ONLY_PREFLIGHT (no public listeners or firewall changes)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: twilight-debian13-stage3-preflight
  cancel-in-progress: false

jobs:
  stage3-adcs-preflight:
    name: Stage III DNS, trusted TLS and host readiness (no changes)
    if: github.repository == 'adrianf87/dc24h.eu-twilight' && github.actor == 'adrianf87' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, twilight-debian13-stage2]
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.sha }}
      OWNER_CONFIRMATION: ${{ inputs.confirmation }}
      CI: 'true'
    steps:
      - name: Verify exact OWNER dispatch, protected branch and sudo identity
        shell: bash
        run: |
          set -euo pipefail
          test "$OWNER_CONFIRMATION" = 'RUN_STAGE3_ADCS_READ_ONLY_PREFLIGHT'
          test "$RUNNER_NAME" = 'server-747585786'
          test "$(id -un)" = 'github-runner'
          test "$(sudo -n id -u)" = '0'

      - name: Checkout exact protected main source without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact SHA and read-only preflight unit tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          (cd scripts && python3 -m unittest -v test_public_stage3_adcs_preflight.py)

      - name: Privileged, read-only public ADCS readiness inventory
        shell: bash
        run: |
          set -euo pipefail
          # Required root privileges are read-only: OS, local IPv4, listeners,
          # systemd states and existing certificate/key validation. No ACME,
          # firewall, install, user, service or DNS write is permitted.
          sudo -n python3 scripts/public_stage3_adcs_preflight.py \
            --expected-sha "$EXPECTED_SHA" \
            --actor "$GITHUB_ACTOR" --ref "$GITHUB_REF" \
            --runner "$RUNNER_NAME" --runner-user "$(id -un)" \
            --report "$RUNNER_TEMP/stage3-adcs-read-only-summary.json"

      - name: Upload only sanitized, bounded inventory (even when blocked)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: twilight-debian13-stage3-adcs-preflight
          path: ${{ runner.temp }}/stage3-adcs-read-only-summary.json
          if-no-files-found: ignore
          retention-days: 7
