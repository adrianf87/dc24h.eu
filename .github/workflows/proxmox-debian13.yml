name: Proxmox Debian 13 Tests

on:
  push:
    branches: [main, "alpha-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proxmox-vm100
  cancel-in-progress: false

jobs:
  start:
    name: Start VM 100
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Power on Debian 13
        shell: bash
        env:
          SSH_KEY: ${{ secrets.PVE_VM100_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PVE_VM100_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/pve_ci
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

          ssh_pve() {
            ssh -i ~/.ssh/pve_ci -p 32884 \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              ci-power-ssh@51.255.80.233 "$1"
          }

          STATUS=$(ssh_pve status)

          if [[ "$STATUS" != "stopped" ]]; then
            echo "VM 100 musi byc wylaczona: $STATUS"
            exit 1
          fi

          ssh_pve start

          for i in $(seq 1 24); do
            STATUS=$(ssh_pve status)
            if [[ "$STATUS" == "running" ]]; then
              echo "Debian 13 uruchomiony."
              exit 0
            fi
            sleep 5
          done

          echo "VM 100 nie wystartowala."
          exit 1

  test:
    name: Debian 13 - ${{ matrix.build_type }} - CMake and CTest
    needs: start
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        build_type: [Debug, Release]
    runs-on: [self-hosted, Linux, X64, ci-controller]
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify Debian 13 custom runner
        shell: bash
        run: |
          set -euo pipefail
          cat /etc/os-release
          . /etc/os-release
          test "$ID" = debian
          test "$VERSION_ID" = 13
          cmake --version
          c++ --version
          ncdc --version

      - name: Configure
        run: |
          cmake -S . -B "build-debian13-${{ matrix.build_type }}" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DDC24H_REQUIRE_INTEGRATION_TESTS=ON

      - name: Build
        run: cmake --build "build-debian13-${{ matrix.build_type }}" --parallel 2

      - name: Test
        run: ctest --test-dir "build-debian13-${{ matrix.build_type }}" --output-on-failure

  shutdown:
    name: Shutdown VM 100
    needs: [start, test]
    if: ${{ always() && needs.start.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Power off Debian 13
        shell: bash
        env:
          SSH_KEY: ${{ secrets.PVE_VM100_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PVE_VM100_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/pve_ci
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

          ssh_pve() {
            ssh -i ~/.ssh/pve_ci -p 32884 \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              ci-power-ssh@51.255.80.233 "$1"
          }

          STATUS=$(ssh_pve status)

          if [[ "$STATUS" == "running" ]]; then
            ssh_pve shutdown
          fi

          for i in $(seq 1 36); do
            STATUS=$(ssh_pve status)
            if [[ "$STATUS" == "stopped" ]]; then
              echo "VM 100 wylaczona."
              exit 0
            fi
            sleep 5
          done

          echo "VM 100 nie wylaczyla sie."
          exit 1
