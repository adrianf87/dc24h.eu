
name: Test polaczenia Proxmox

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-proxmox:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Sprawdz status Debian 13 VM 100
        shell: bash
        env:
          SSH_KEY: ${{ secrets.PVE_VM100_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PVE_VM100_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          umask 077
          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/pve_ci
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

          STATUS=$(ssh \
            -i ~/.ssh/pve_ci \
            -p 32884 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            ci-power-ssh@51.255.80.233 status)

          echo "Proxmox VM 100: $STATUS"

          case "$STATUS" in
            running|stopped)
              echo "Polaczenie z Proxmox API dziala."
              ;;
            *)
              exit 1
              ;;
          esac
