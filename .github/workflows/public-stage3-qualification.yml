name: Stage III public ADCS qualification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/stage4-webadmin-dedicated-service]

permissions:
  contents: read

env:
  PYTHONPATH: scripts
  PYTHONDONTWRITEBYTECODE: '1'
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  offline:
    name: Offline build and full CTest / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Verify GitHub-hosted Ubuntu runner
        env:
          EXPECTED_IMAGE: ${{ matrix.os }}
        run: |
          . /etc/os-release
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$ID" = ubuntu && test "$VERSION_ID" = "${EXPECTED_IMAGE#ubuntu-}"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Install Ubuntu packaged build and integration dependencies
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          bash .github/scripts/install-ci-deps.sh \
            build-essential cmake python3 libutf8proc-dev libgcrypt20-dev libssl-dev libmariadb-dev \
            openssl ncdc mariadb-server apache2
      - name: Build and run exact-source CTest without elevating repository executables
        env:
          DC24H_REQUIRE_SYSTEMD_HOST: '1'
          RUNNER_IMAGE: ${{ matrix.os }}
        run: |
          test "$(id -u)" != '0'
          threads="$(nproc)"
          if (( threads > 16 )); then threads=16; fi
          python3 -m stage3.run run offline --sha "$SOURCE_SHA" --image "$RUNNER_IMAGE" \
            --output "$RUNNER_TEMP/results" --parallel "$threads"
      - name: Upload sanitized offline results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage3-offline-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: error
      - name: Upload attested test binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage3-binary-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/binary/
          if-no-files-found: error

  sandbox:
    name: Ubuntu sudo and systemd unit verification / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - name: Verify GitHub-hosted Ubuntu runner
        env:
          EXPECTED_IMAGE: ${{ matrix.os }}
        run: |
          . /etc/os-release
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$ID" = ubuntu && test "$VERSION_ID" = "${EXPECTED_IMAGE#ubuntu-}"
      - id: fixed_fixture
        name: Run packaged systemd tools on disposable GitHub runner
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -u)" != '0'
          test "$(sudo -n id -u)" = '0'
          systemctl --version
          sudo -n systemd-run --wait --collect --quiet \
            --property=User=nobody --property=NoNewPrivileges=yes \
            --property=PrivateNetwork=yes --property=ProtectSystem=strict /bin/true
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: '!cancelled()'
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify the submitted unit file without starting it
        if: '!cancelled()'
        env:
          FIXTURE_OUTCOME: ${{ steps.fixed_fixture.outcome }}
          RUNNER_IMAGE: ${{ matrix.os }}
        run: |
          python3 -m stage3.run run sandbox --sha "$SOURCE_SHA" --image "$RUNNER_IMAGE" \
            --output "$RUNNER_TEMP/results" --sudo-result "$FIXTURE_OUTCOME"
      - name: Upload sanitized systemd results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage3-sandbox-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: error

  loopback:
    name: ${{ matrix.group }} / ${{ matrix.os }}
    needs: [offline, sandbox]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
        group: [two-client, tls-fixtures, stability]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Verify GitHub-hosted Ubuntu runner
        env:
          EXPECTED_IMAGE: ${{ matrix.os }}
        run: |
          . /etc/os-release
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$ID" = ubuntu && test "$VERSION_ID" = "${EXPECTED_IMAGE#ubuntu-}"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Install Ubuntu clients and hub runtime dependencies
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          bash .github/scripts/install-ci-deps.sh \
            ncdc openssl libgcrypt20 libutf8proc-dev libmariadb-dev
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: stage3-binary-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/binary
      - name: Exercise the exact build on loopback
        env:
          TEST_GROUP: ${{ matrix.group }}
          RUNNER_IMAGE: ${{ matrix.os }}
        run: |
          python3 -m stage3.run run "$TEST_GROUP" --sha "$SOURCE_SHA" --image "$RUNNER_IMAGE" \
            --binary "$RUNNER_TEMP/binary" --output "$RUNNER_TEMP/results"
      - name: Upload sanitized loopback results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage3-${{ matrix.group }}-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: error

  evidence:
    name: Verify complete exact-head evidence and publish qualification matrix
    needs: [offline, sandbox, loopback]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Verify GitHub-hosted Ubuntu 22.04 runner
        run: |
          . /etc/os-release
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$ID" = ubuntu && test "$VERSION_ID" = 22.04
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: stage3-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bundles
      - name: Verify SHA-256 manifests, test outcomes and run provenance
        if: '!cancelled()'
        env:
          REPORT_MODE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected && github.repository == 'adrianf87/dc24h.eu' && 'main' || 'pr' }}
        run: |
          python3 -m stage3.run report --mode "$REPORT_MODE" --sha "$SOURCE_SHA" --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --input "$RUNNER_TEMP/bundles" --output "$RUNNER_TEMP/report"
      - name: Publish qualification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage3-qualification-report-${{ github.run_attempt }}
          path: ${{ runner.temp }}/report/
          if-no-files-found: error
