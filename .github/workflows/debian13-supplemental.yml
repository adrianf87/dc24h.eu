name: Debian 13 supplemental smoke (OWNER only)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RUN_SAFE_TESTS_NO_SUDO to confirm isolated read-only testing'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: twilight-debian13-supplemental
  cancel-in-progress: false

jobs:
  read-only-inventory-and-smoke:
    name: Debian 13 isolated supplemental source smoke
    if: github.repository == 'adrianf87/dc24h.eu-twilight' && github.actor == 'adrianf87' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, twilight-debian13-stage2]
    timeout-minutes: 15
    env:
      CI: 'true'
      EXPECTED_SHA: ${{ github.sha }}
      OWNER_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Verify explicit OWNER confirmation and runner identity
        shell: bash
        run: |
          set -euo pipefail
          test "$OWNER_CONFIRMATION" = 'RUN_SAFE_TESTS_NO_SUDO'
          test "$RUNNER_NAME" = 'server-747585786'
          test "$(id -un)" = 'github-runner'

      - name: Checkout exact reviewed main source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify immutable checked-out source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Bounded read-only host inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 self-hosted-runner-debian13/tests/runner_preflight.py \
            --expected-sha "$EXPECTED_SHA" \
            > "$RUNNER_TEMP/twilight-debian13-runner-preflight.json"

      - name: Run source-only policy and Stage II regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 self-hosted-runner-debian13/tests/test_runner_contract.py
          python3 tests/project_checks.py
          python3 tests/project_language_policy_tests.py
          python3 tests/public_stage2_preflight_tests.py

      - name: Upload only bounded sanitized inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: twilight-debian13-supplemental-inventory
          path: ${{ runner.temp }}/twilight-debian13-runner-preflight.json
          if-no-files-found: ignore
          retention-days: 7
